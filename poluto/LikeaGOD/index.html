<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Simulator - Trophic Chain</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="stats-panel">
                <h1>God Simulator</h1>
                <div id="world-stats">
                    <p>Día: <span id="day-counter">0</span></p>
                    <p>Año: <span id="year-counter">0</span></p>
                </div>
                <div id="population-stats"></div>
            </div>
            <div id="god-powers">
                <button id="btn-rain" class="power-btn">🌧️ Lluvia</button>
                <button id="btn-meteor" class="power-btn">☄️ Meteoro</button>
                <div class="time-controls">
                    <button id="btn-pause">⏸️ Pausa</button>
                    <button id="btn-play">▶️ Play</button>
                    <button id="btn-fast">⏩ x10</button>
                </div>
            </div>
            <div id="entity-info" style="display: none;">
                <h3>Entidad Seleccionada</h3>
                <div id="entity-details"></div>
            </div>
        </div>
    </div>
    <script src="game-bundle.js"></script>
</body>

</html>
