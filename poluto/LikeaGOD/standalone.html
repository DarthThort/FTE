<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Simulator - Trophic Chain</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --ui-bg: rgba(0, 0, 0, 0.7);
            --accent-color: #4CAF50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #stats-panel, #god-powers {
            background-color: var(--ui-bg);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        #stats-panel h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .power-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .power-btn:hover {
            background-color: #444;
        }

        .time-controls {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .time-controls button {
            flex: 1;
            padding: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }

        .time-controls button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="stats-panel">
                <h1>God Simulator</h1>
                <div id="world-stats">
                    <p>Día: <span id="day-counter">0</span></p>
                    <p>Año: <span id="year-counter">0</span></p>
                </div>
                <div id="population-stats">
                    <!-- Dynamic population stats will go here -->
                </div>
            </div>
            <div id="god-powers">
                <button id="btn-rain" class="power-btn">🌧️ Lluvia</button>
                <button id="btn-meteor" class="power-btn">☄️ Meteoro</button>
                <div class="time-controls">
                    <button id="btn-pause">⏸️</button>
                    <button id="btn-x1">▶️</button>
                    <button id="btn-x2">⏩</button>
                    <button id="btn-x5">⏭️</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game-bundle.js"></script>
</body>
</html>
