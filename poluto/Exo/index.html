<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exo-Génesis - Evolution Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Canvas -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD Overlay -->
        <div id="hud">
            <div class="hud-panel top-left">
                <h2>EXO-GÉNESIS</h2>
                <div class="stat-row">
                    <span class="label">Época:</span>
                    <span id="epoch" class="value">Génesis</span>
                </div>
                <div class="stat-row">
                    <span class="label">Año:</span>
                    <span id="year" class="value">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">Población:</span>
                    <span id="population" class="value">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">Especies:</span>
                    <span id="species-count" class="value">0</span>
                </div>
            </div>

            <!-- God Powers Toolbar -->
            <div class="hud-panel top-right">
                <h3>Poderes Divinos</h3>
                <div class="power-grid">
                    <button class="power-btn" id="btn-rain" title="Aumentar lluvia">
                        <span class="icon">💧</span>
                        <span class="label">Lluvia</span>
                    </button>
                    <button class="power-btn" id="btn-drought" title="Sequía">
                        <span class="icon">☀️</span>
                        <span class="label">Sequía</span>
                    </button>
                    <button class="power-btn" id="btn-heat" title="Calentar">
                        <span class="icon">🔥</span>
                        <span class="label">Calor</span>
                    </button>
                    <button class="power-btn" id="btn-freeze" title="Enfriar">
                        <span class="icon">❄️</span>
                        <span class="label">Hielo</span>
                    </button>
                    <button class="power-btn" id="btn-meteor" title="Meteorito">
                        <span class="icon">☄️</span>
                        <span class="label">Meteorito</span>
                    </button>
                    <button class="power-btn" id="btn-spawn" title="Crear criatura">
                        <span class="icon">🧬</span>
                        <span class="label">Crear</span>
                    </button>
                </div>
                <div class="time-controls">
                    <button class="time-btn" id="btn-pause">⏸ Pausar</button>
                    <button class="time-btn active" id="btn-speed-1x">1x</button>
                    <button class="time-btn" id="btn-speed-2x">2x</button>
                    <button class="time-btn" id="btn-speed-5x">5x</button>
                </div>
            </div>

            <!-- Creature Inspector Panel -->
            <div class="hud-panel bottom-left" id="inspector" style="display: none;">
                <h3>Inspector de Criatura</h3>
                <div id="inspector-content">
                    <div class="stat-row">
                        <span class="label">ID:</span>
                        <span id="creature-id" class="value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">Edad:</span>
                        <span id="creature-age" class="value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">Energía:</span>
                        <span id="creature-energy" class="value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">Hambre:</span>
                        <span id="creature-hunger" class="value">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">Dieta:</span>
                        <span id="creature-diet" class="value">-</span>
                    </div>
                    <div class="genome-display">
                        <h4>Genoma</h4>
                        <canvas id="genome-canvas" width="200" height="100"></canvas>
                    </div>
                </div>
            </div>

            <!-- Event Log -->
            <div class="hud-panel bottom-right" id="event-log">
                <h3>Registro de Eventos</h3>
                <div id="log-content"></div>
            </div>

            <!-- Minimap -->
            <div class="minimap-container">
                <canvas id="minimap"></canvas>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/utils.js"></script>
    <script src="js/world.js"></script>
    <script src="js/genetics.js"></script>
    <script src="js/creature.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
