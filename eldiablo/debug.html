<!DOCTYPE html>
<html>

<head>
    <title>Debug Test</title>
</head>

<body>
    <h1>Debug Test</h1>
    <div id="log"></div>
    <script>
        const log = document.getElementById('log');

        try {
            log.innerHTML += '<p>Loading classes...</p>';

            // Simulate loading
            const scripts = [
                'src/engine/Input.js',
                'src/engine/Renderer.js',
                'src/engine/Sound.js',
                'src/engine/Effect.js',
                'src/game/Entity.js',
                'src/game/Item.js',
                'src/game/Player.js',
                'src/game/Enemy.js',
                'src/game/Map.js',
                'src/engine/Game.js'
            ];

            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onerror = () => {
                    log.innerHTML += `<p style="color:red;">Failed to load: ${src}</p>`;
                };
                script.onload = () => {
                    log.innerHTML += `<p style="color:green;">Loaded: ${src}</p>`;
                };
                document.head.appendChild(script);
            });

            setTimeout(() => {
                log.innerHTML += '<p>Testing Map...</p>';
                try {
                    const map = new Map(50, 50);
                    log.innerHTML += `<p style="color:green;">Map created! Rooms: ${map.rooms.length}</p>`;
                } catch (e) {
                    log.innerHTML += `<p style="color:red;">Map error: ${e.message}</p>`;
                    log.innerHTML += `<pre>${e.stack}</pre>`;
                }
            }, 2000);

        } catch (e) {
            log.innerHTML += `<p style="color:red;">Error: ${e.message}</p>`;
        }
    </script>
</body>

</html>
